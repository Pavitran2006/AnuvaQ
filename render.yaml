services:
  # FastAPI Quantum Backend Service
  - type: web
    name: anuvaq-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anuvaq-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  # Managed PostgreSQL Database
  - name: anuvaq-postgres
    databaseName: anuvaq_db
    user: anuvaq_user
    plan: free
